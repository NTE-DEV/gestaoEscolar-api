services:
  gestao-docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: gestao-docker-socket-proxy
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - CONTAINERS=1
      - POST=0
      - DELETE=0
      - PUT=0
      - PATCH=0
      - EXEC=0
      - IMAGES=0
      - NETWORKS=0
      - VOLUMES=0
      - SWARM=0
    networks:
      - gestao-net

  gestao-escolar-app:
    build:
      context: ./backend-laravel
      dockerfile: Dockerfile
    image: gestao-escolar-app:latest
    container_name: gestao-escolar-app
    restart: unless-stopped
    volumes:
      - ./backend-laravel:/var/www/html
    env_file:
      - ./backend-laravel/.env.production
    environment:
      - DOCKER_HOST_HTTP=http://gestao-docker-socket-proxy:2375
    depends_on:
      - gestao-docker-socket-proxy
    networks:
      - gestao-net

  gestao-escolar-scheduler:
    image: gestao-escolar-app:latest
    container_name: gestao-escolar-scheduler
    restart: unless-stopped
    command: sh -c "while true; do php artisan schedule:run --no-interaction; sleep 60; done"
    volumes:
      - ./backend-laravel:/var/www/html
    env_file:
      - ./backend-laravel/.env.production
    environment:
      - DOCKER_HOST_HTTP=http://gestao-docker-socket-proxy:2375
    depends_on:
      - gestao-escolar-app
    networks:
      - gestao-net

  gestao-escolar-web:
    build:
      context: ./frontend-admin
      dockerfile: Dockerfile
      args:
        - VITE_BASE_PATH=/admin/
        - VITE_API_BASE_URL=/GE/v1
    image: gestao-escolar-web:latest
    container_name: gestao-escolar-web
    restart: unless-stopped
    volumes:
      - ./backend-laravel/storage/app/public:/var/www/html/storage/app/public:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - gestao-net
    depends_on:
      - gestao-escolar-app

networks:
  gestao-net:
    external: true
